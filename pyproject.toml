[project]
name = "mri-prep"
version = "0.2.0"
description = "MRI + tabular data pipeline (BIDS conversion, preprocessing, QC, export) for neurodegenerative disease progression modeling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "antspyx>=0.6.2",
    "intensity-normalization==2.2.4",
    "pandas>=2.2.2",
    "nbformat>=5.10.4",
    "openpyxl>=3.1.5",
    "plotly>=6.6.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "upsetplot",
    "nilearn>=0.10.2",
    "monai[all]>=1.6.0",
    "nibabel>=3,<4",
    "pyyaml>=6.0.2",
    "pydantic>=2.8.0",
    "typer>=0.12.5",
]

[project.scripts]
mri-prep = "mri_prep.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mri_prep"]
